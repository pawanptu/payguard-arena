<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="PayGuard: an ops console for PayPal payout fraud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3d"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1130" cy="40" r="170" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="1210" cy="250" r="110" fill="#60a5fa" fill-opacity="0.08"/>

  <!-- shield mark -->
  <g transform="translate(70 62)">
    <path d="M70 0 L134 24 V84 C134 128 106 160 70 176 C34 160 6 128 6 84 V24 Z" fill="url(#shield)"/>
    <path d="M40 88 L62 110 L102 64" fill="none" stroke="#0b1a3d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="245" y="128" fill="#ffffff" font-size="74" font-weight="800" letter-spacing="-1">PayGuard</text>
    <text x="249" y="174" fill="#cfe3ff" font-size="29" font-weight="500">An ops console for PayPal payout fraud</text>

    <g font-size="19" font-weight="600">
      <rect x="249" y="204" width="236" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#93c5fd" stroke-opacity="0.5"/>
      <text x="367" y="230" fill="#e0f2fe" text-anchor="middle">Self-evolving swarm</text>
      <rect x="497" y="204" width="270" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#93c5fd" stroke-opacity="0.5"/>
      <text x="632" y="230" fill="#e0f2fe" text-anchor="middle">Grounded AI explanations</text>
      <rect x="779" y="204" width="270" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#93c5fd" stroke-opacity="0.5"/>
      <text x="914" y="230" fill="#e0f2fe" text-anchor="middle">Agent Toolkit copilot</text>
    </g>
    <text x="1250" y="282" fill="#93c5fd" fill-opacity="0.8" font-size="15" text-anchor="end">PayPal AI Hackathon 2026 · simulated, synthetic data</text>
  </g>
</svg>
