[project]
name = "payguard-arena"
version = "0.0.1"
description = "Co-evolving fraud arms race on instant gig payouts, using PayPal sandbox Payouts and a swarm of self-evolving defender agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
